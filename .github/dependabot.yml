version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (TypeScript, ESLint, Stylelint and their plugins move together) are upgraded
    # on purpose in their own PR, not by Dependabot. @types/node stays on the runtime's major
    # from .nvmrc for the same reason.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same as npm: a major version of an action (release-please-action 5, say) can change how the
    # pipeline behaves, so it is upgraded on purpose, not merged by Dependabot.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: ci
