# Regenerates the screenshot baselines on the Windows runner and commits them to the branch.
# Run by hand from the Actions tab. The PR then needs Jim's baseline-approved label to merge.
name: update-baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on (never main)
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-2025
    steps:
      - name: Refuse to run on main
        if: inputs.branch == 'main'
        shell: bash
        run: |
          echo "Baselines change only on a PR branch, never on main."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # Keep tokens out of .git/config while the branch's own code and install scripts run.
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
      - run: npx playwright test --project=visual --update-snapshots --pass-with-no-tests
      # RELEASE_TOKEN (not GITHUB_TOKEN) pushes, so CI runs again on the new commit. It is given
      # to this one step only.
      - name: Commit the new baselines
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__ || true
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "test: update screenshot baselines"
            git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
          fi
