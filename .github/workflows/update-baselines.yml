# Regenerates the screenshot baselines on the Windows runner and commits them to a PR branch.
# Run by hand from the Actions tab. The PR then needs Jim's baseline-approved label to merge.
#
# Two jobs, so RELEASE_TOKEN never shares a workspace with the branch's own code:
# 1. render runs the branch's install scripts and tests with no secrets and uploads the PNGs.
# 2. push makes a fresh checkout, runs nothing from the branch, and commits the PNGs.
name: update-baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on (never main)
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-2025
    outputs:
      commit: ${{ steps.result.outputs.commit }}
      has-baselines: ${{ steps.result.outputs.has-baselines }}
    steps:
      - name: Refuse to run on main
        if: inputs.branch == 'main'
        shell: bash
        run: |
          echo "Baselines change only on a PR branch, never on main."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
      - run: npx playwright test --project=visual --update-snapshots --pass-with-no-tests
      - name: Record the commit rendered and whether any baselines exist
        id: result
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d tests/visual/__screenshots__ ]; then
            echo "has-baselines=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-baselines=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.result.outputs.has-baselines == 'true'
        with:
          name: baselines
          path: tests/visual/__screenshots__/
          retention-days: 1

  push:
    needs: render
    if: needs.render.outputs.has-baselines == 'true'
    runs-on: ubuntu-latest
    steps:
      # The exact commit that was rendered: if the branch moved since, the push fails as a
      # non-fast-forward instead of committing screenshots of older code onto newer code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.render.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: baselines
          path: tests/visual/__screenshots__/
      # RELEASE_TOKEN (not GITHUB_TOKEN) pushes, so CI runs again on the new commit. Nothing from
      # the branch has run in this job, and git ignores hooks and any global config.
      - name: Commit the new baselines
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          git_clean() {
            git -c core.hooksPath=/dev/null \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" "$@"
          }
          git_clean add tests/visual/__screenshots__ || true
          if git_clean diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git_clean commit -m "test: update screenshot baselines"
          git_clean push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
