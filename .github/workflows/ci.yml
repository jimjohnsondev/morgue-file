# Every pull request must pass these jobs before it can merge.
# PR 2 adds e2e, visual, perf and baseline-guard (see docs/ARCHITECTURE.md, CI and release).
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|build|ci)(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title must be a Conventional Commit, e.g. 'feat: index template'. Got: $TITLE"
            exit 1
          fi

  lint-typecheck:
    name: lint-typecheck
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
