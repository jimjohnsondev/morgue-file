# The build, test and lint jobs every pull request must pass. pr-checks.yml holds the quick checks
# that also re-run on title and label changes. scripts/setup-repo.ts makes every job here a
# required check on main (as are pr-checks.yml's), so a job renamed in either workflow must be
# renamed in REQUIRED_CHECKS there too. There is no merge_group trigger: the repo has no merge queue.
name: ci

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:readme
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: test-results/
          retention-days: 7

  visual:
    name: visual
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      # Visual tests arrive with the templates (PR 7); until then the job passes with none.
      - run: npx playwright test --project=visual --pass-with-no-tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  perf:
    name: perf
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      # perf.db follows the schema, so it's made fresh here rather than cached with the archive.
      - run: npm run fixtures:perf
      # Perf tests arrive with the query engine (PR 7); until then the job passes with none.
      - run: npx playwright test --project=perf --pass-with-no-tests
