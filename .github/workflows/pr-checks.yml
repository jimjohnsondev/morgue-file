# Quick checks that must re-run when a PR's title or labels change, kept apart from ci.yml so a
# label change never re-runs (or skips) the build and test jobs.
name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|build|ci)(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title must be a Conventional Commit, e.g. 'feat: index template'. Got: $TITLE"
            exit 1
          fi

  baseline-guard:
    name: baseline-guard
    runs-on: ubuntu-latest
    steps:
      - name: Screenshot baselines change only with the baseline-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh pr view "$PR" --repo "$REPO" --json files --jq '[.files[].path | select(startswith("tests/visual/__screenshots__/"))] | length')
          approved=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name | select(. == "baseline-approved")] | length')
          echo "Changed baseline files: $changed. Approved label: $approved."
          if [ "$changed" != "0" ] && [ "$approved" = "0" ]; then
            echo "This PR changes screenshot baselines. Jim must add the baseline-approved label."
            exit 1
          fi
